<html lang="en">

<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

  <!-- ERROR CHECKER ALERTS (Just in case) -->
  <script>
    window.onerror = function(msg) {
      if(msg.includes("localStorage")) {
        console.warn("Incognito Storage blocked, but app will continue running.");
      }
    };
  </script>

      <div class="space-y-4">

            <optgroup label="👑 Admins">
              <option value="admin_zoro">Zoro (Admin 1)</option>
              <option value="admin_aditya">Aditya (Admin 2)</option>
            </optgroup>
            <optgroup label="📋 Pickers">
              <option value="picker_princ">Princ (Picker 1)</option>
              <option value="picker_anas">Anas (Picker 2)</option>
              <option value="picker_kundan">Kundan (Picker 3)</option>
            </optgroup>
            <optgroup label="📦 Packers">
              <option value="packer_sarika">Sarika (Packer 1)</option>
              <option value="packer_komal">Komal (Packer 2)</option>
            </optgroup>

        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">4-Digit Security PIN</label>

  </div>

  <!-- MAIN APP SCREEN -->

    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
      <div class="max-w-5xl mx-auto px-4 py-3">
        <div class="flex justify-between items-center mb-3">
          <div>
            <h2 id="displayUserName" class="text-base font-bold text-slate-900 leading-tight"></h2>
            <span id="displayUserRole" class="text-xs font-semibold uppercase tracking-wider px-2 py-0.5 rounded bg-blue-100 text-blue-700"></span>
          </div>
          <div class="flex gap-2 items-center">
            <button id="deleteLastBtn" onclick="window.deleteLastTask()" class="hidden bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 px-3 py-1.5 rounded-lg text-xs font-semibold transition">
              <i class="fa-solid fa-trash-can mr-1"></i> Delete Last
            </button>
            <button id="addBoxBtn" onclick="window.openAddModal()" class="hidden bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow transition">
              + New Box
            </button>
            <button onclick="window.handleLogout()" class="text-slate-500 hover:text-red-600 p-2 rounded-lg text-sm" title="Logout">
              <i class="fa-solid fa-arrow-right-from-bracket"></i>
            </button>
          </div>
        </div>

        <!-- SEARCH BAR -->
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs"></i>
          <input id="searchInput" oninput="window.onSearchChange()" type="text" placeholder="Type PK (e.g. PK3), Box number, Picker or Packer name..." class="w-full pl-9 pr-8 py-2 text-xs sm:text-sm bg-slate-50 border border-slate-300 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition">

            <option value="4 Quantity">4 Quantity</option>

            <select id="formPicker" class="w-full border p-2 rounded-lg text-sm bg-white">
              <option value="Princ">Princ</option>
              <option value="Anas">Anas</option>
              <option value="Kundan">Kundan</option>

        <div class="flex gap-2 pt-3">

          <button type="submit" id="saveSubmitBtn" class="w-1/2 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold hover:bg-blue-700 shadow">Save Box</button>
        </div>
      </form>
    </div>
  </div>

  <!-- SCRIPT 1: CORE UI & LOGIN (SAFE FROM ERRORS) -->
  <script>
    const USERS = {
      "admin_zoro": { name: "Zoro", role: "admin", pin: "1111" },
      "admin_aditya": { name: "Aditya", role: "admin", pin: "2222" },
      "picker_princ": { name: "Princ", role: "picker", pin: "3001" },
      "picker_anas": { name: "Anas", role: "picker", pin: "3002" },
      "picker_kundan": { name: "Kundan", role: "picker", pin: "3003" },
      "packer_sarika": { name: "Sarika", role: "packer", pin: "4001" },
      "packer_komal": { name: "Komal", role: "packer", pin: "4002" }
    };

    window.currentUser = null;
    window.allLiveTasks = [];

    // Safe memory functions (Won't crash in Incognito)
    function safeSetMemory(key, value) {
      try { localStorage.setItem(key, value); } catch (e) { console.log("Memory blocked"); }
    }
    function safeGetMemory(key) {
      try { return localStorage.getItem(key); } catch (e) { return null; }
    }
    function safeClearMemory(key) {
      try { localStorage.removeItem(key); } catch (e) {}
    }

    // Direct Login Logic
    window.handleLogin = function() {
      const selectedKey = document.getElementById("userSelect").value;
      const enteredPin = document.getElementById("pinInput").value;
      const user = USERS[selectedKey];

      if (user && user.pin === enteredPin) {
        window.currentUser = user;
        safeSetMemory("warehouseLoggedInUser", selectedKey);

        document.getElementById("loginError").classList.add("hidden");
        document.getElementById("loginScreen").classList.add("hidden");
        document.getElementById("appScreen").classList.remove("hidden");
        
        document.getElementById("displayUserName").textContent = window.currentUser.name;
        document.getElementById("displayUserRole").textContent = window.currentUser.role.toUpperCase();

        if (window.currentUser.role === 'admin') {
          document.getElementById("addBoxBtn").classList.remove("hidden");
          document.getElementById("deleteLastBtn").classList.remove("hidden");
        } else {
          document.getElementById("addBoxBtn").classList.add("hidden");
          document.getElementById("deleteLastBtn").classList.add("hidden");
        }

        if(window.startDatabaseListener) {
          window.startDatabaseListener();
        } else {
          // Retry connecting to DB if it's still loading
          setTimeout(() => { if(window.startDatabaseListener) window.startDatabaseListener(); }, 1500);
        }
      } else {
        document.getElementById("loginError").classList.remove("hidden");
      }
    };

    window.handleLogout = function() {
      window.currentUser = null;
      safeClearMemory("warehouseLoggedInUser");
      document.getElementById("pinInput").value = "";
      document.getElementById("searchInput").value = "";
      document.getElementById("appScreen").classList.add("hidden");
      document.getElementById("loginScreen").classList.remove("hidden");
    };

    window.openAddModal = () => document.getElementById("addModal").classList.remove("hidden");
    window.closeAddModal = () => {
      document.getElementById("addModal").classList.add("hidden");
      document.getElementById("newBatchForm").reset();
    };

    window.onSearchChange = () => {
      const val = document.getElementById("searchInput").value;
      const clearBtn = document.getElementById("clearSearchBtn");
      if (val.trim() !== "") clearBtn.classList.remove("hidden");
      else clearBtn.classList.add("hidden");
      if(window.renderCards) window.renderCards();
    };

    window.clearSearch = () => {
      const input = document.getElementById("searchInput");
      if (input) input.value = "";
      document.getElementById("clearSearchBtn").classList.add("hidden");
      if(window.renderCards) window.renderCards();
    };

    // Auto-Login Setup
    window.addEventListener("DOMContentLoaded", () => {
      const savedUser = safeGetMemory("warehouseLoggedInUser");
      if (savedUser && USERS[savedUser]) {
        document.getElementById("userSelect").value = savedUser;
        document.getElementById("pinInput").value = USERS[savedUser].pin;
        setTimeout(() => window.handleLogin(), 300);
      }
    });
  </script>

  <!-- SCRIPT 2: FIREBASE DATABASE (Separated completely) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, addDoc, deleteDoc, serverTimestamp } 
      from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCOY9tUBNH3O9JM3LV9ICgoO2y9PIs9dQY",
      authDomain: "warehouse-af16e.firebaseapp.com",
      projectId: "warehouse-af16e",
      storageBucket: "warehouse-af16e.firebasestorage.app",
      messagingSenderId: "574015704554",
      appId: "1:574015704554:web:5f2945974eaa50c85df693"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const ordersCol = collection(db, "warehouse_tasks");
    let dbListener = null;

    window.startDatabaseListener = function() {
      if (dbListener) dbListener();
      dbListener = onSnapshot(ordersCol, (snapshot) => {
        window.allLiveTasks = [];
        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          let ts = data.createdAt?.seconds || (Date.now() / 1000);
          window.allLiveTasks.push({ id: docSnap.id, ...data, _time: ts });
        });
        window.allLiveTasks.sort((a, b) => b._time - a._time);
        if (window.renderCards) window.renderCards();
      }, (error) => {
        console.error("Firebase Sync Error: ", error);
      });
    };

    window.renderCards = function() {
      const grid = document.getElementById("cardsGrid");
      if (!grid || !window.currentUser) return;
      grid.innerHTML = "";
      
      const searchRaw = (document.getElementById("searchInput")?.value || "").toLowerCase().trim();

      let userList = window.allLiveTasks.filter(item => {
        if (window.currentUser.role === 'admin') return true;
        if (window.currentUser.role === 'picker') return (item.picker || '').toLowerCase() === window.currentUser.name.toLowerCase();
        if (window.currentUser.role === 'packer') return (item.packer || '').toLowerCase() === window.currentUser.name.toLowerCase();
        return false;
      });

      let displayList = userList.filter(item => {
        if (!searchRaw) return true;
        const fullString = [item.pkBatch, item.boxNo, item.picker, item.packer, item.orderType, item.notes].join(" ").toLowerCase();
        return fullString.includes(searchRaw);
      });

      if (displayList.length === 0) {
        grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400 font-medium">No tasks found</div>`;
        return;
      }

      displayList.forEach(item => {
        const card = document.createElement("div");
        card.className = `p-4 rounded-xl border bg-white shadow-sm flex flex-col justify-between ${item.hasError ? 'border-red-400 ring-1 ring-red-300' : 'border-slate-200'}`;
        const pickBadge = item.pickingStatus === 'Complete' ? 'bg-emerald-100 text-emerald-800' : item.pickingStatus === 'Ongoing' ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-600';
        const packBadge = item.packingStatus === 'Complete' ? 'bg-emerald-100 text-emerald-800' : item.packingStatus === 'Ongoing' ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-600';

        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start mb-2">
              <div>
                <span class="inline-block bg-blue-50 text-blue-700 text-xs font-bold px-2 py-0.5 rounded border border-blue-100 mb-1">${item.pkBatch}</span>
                <h4 class="text-base font-extrabold text-slate-900">${item.boxNo}</h4>
              </div>
              <div class="flex items-center gap-2">
                <span class="text-xs font-semibold px-2 py-0.5 rounded bg-slate-100 text-slate-700">${item.orderType || 'General'}</span>
                ${window.currentUser.role === 'admin' ? `<button onclick="window.deleteDocItem('${item.id}', '${item.pkBatch} - ${item.boxNo}')" class="text-red-400 hover:text-red-600 p-1"><i class="fa-solid fa-trash-can text-sm"></i></button>` : ''}
              </div>
            </div>
            <div class="text-xs space-y-1 my-3 bg-slate-50 p-2.5 rounded-lg border border-slate-100">
              <div class="flex justify-between"><span class="text-slate-500 font-medium">Picker: <strong>${item.picker}</strong></span><span class="px-1.5 py-0.5 rounded text-[10px] font-bold ${pickBadge}">${item.pickingStatus}</span></div>
              <div class="flex justify-between"><span class="text-slate-500 font-medium">Packer: <strong>${item.packer}</strong></span><span class="px-1.5 py-0.5 rounded text-[10px] font-bold ${packBadge}">${item.packingStatus}</span></div>
              ${item.pendingQty ? `<div class="text-red-600 font-bold pt-1">Pending Qty: ${item.pendingQty}</div>` : ''}
            </div>
            ${item.notes ? `<p class="text-xs bg-amber-50 text-amber-900 border border-amber-200 p-2 rounded-lg mb-3">⚠️ ${item.notes}</p>` : ''}
          </div>
          <div class="pt-3 border-t border-slate-100 space-y-2">
            ${(window.currentUser.role === 'picker' || window.currentUser.role === 'admin') ? `
              <div class="flex gap-1.5 items-center">
                <span class="text-[11px] font-bold text-slate-400 w-12">Pick:</span>
                <button onclick="window.updatePickStatus('${item.id}', 'Assigned')" class="flex-1 py-1 text-xs font-medium rounded ${item.pickingStatus === 'Assigned' ? 'bg-slate-800 text-white' : 'bg-slate-100'}">Assigned</button>
                <button onclick="window.updatePickStatus('${item.id}', 'Ongoing')" class="flex-1 py-1 text-xs font-medium rounded ${item.pickingStatus === 'Ongoing' ? 'bg-amber-500 text-white' : 'bg-slate-100'}">Ongoing</button>
                <button onclick="window.updatePickStatus('${item.id}', 'Complete')" class="flex-1 py-1 text-xs font-medium rounded ${item.pickingStatus === 'Complete' ? 'bg-emerald-600 text-white' : 'bg-slate-100'}">Done</button>
              </div>
            ` : ''}
            ${(window.currentUser.role === 'packer' || window.currentUser.role === 'admin') ? `
              <div class="flex gap-1.5 items-center">
                <span class="text-[11px] font-bold text-slate-400 w-12">Pack:</span>
                <button onclick="window.updatePackStatus('${item.id}', 'Assigned')" class="flex-1 py-1 text-xs font-medium rounded ${item.packingStatus === 'Assigned' ? 'bg-slate-800 text-white' : 'bg-slate-100'}">Assigned</button>
                <button onclick="window.updatePackStatus('${item.id}', 'Ongoing')" class="flex-1 py-1 text-xs font-medium rounded ${item.packingStatus === 'Ongoing' ? 'bg-amber-500 text-white' : 'bg-slate-100'}">Ongoing</button>
                <button onclick="window.updatePackStatus('${item.id}', 'Complete')" class="flex-1 py-1 text-xs font-medium rounded ${item.packingStatus === 'Complete' ? 'bg-emerald-600 text-white' : 'bg-slate-100'}">Done</button>
              </div>
              <div clas
