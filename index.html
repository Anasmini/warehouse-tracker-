  <script type="module">


    import {
      initializeApp
    }
    from
    "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";


    import {
      getFirestore,
      collection,
      onSnapshot,
      doc,
      updateDoc,
      addDoc,
      deleteDoc,
      serverTimestamp
    }
    from
    "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";



    /* ================= FIREBASE CONFIG ================= */

    const firebaseConfig = {

      apiKey: "AIzaSyCOY9tUBNH3O9JM3LV9ICgoO2y9PIs9dQY",

      authDomain: "warehouse-af16e.firebaseapp.com",

      projectId: "warehouse-af16e",

      storageBucket: "warehouse-af16e.firebasestorage.app",

      messagingSenderId: "574015704554",

      appId: "1:574015704554:web:5f2945974eaa50c85df693"

    };



    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);

    const ordersCol = collection(db, "warehouse_tasks");



    /* ================= USERS ================= */

    const USERS = {

      "admin_zoro": {
        name: "Zoro",
        role: "admin",
        pin: "1111"
      },

      "admin_aditya": {
        name: "Aditya",
        role: "admin",
        pin: "2222"
      },

      "picker_princ": {
        name: "Princ",
        role: "picker",
        pin: "3001"
      },

      "picker_anas": {
        name: "Anas",
        role: "picker",
        pin: "3002"
      },

      "picker_kundan": {
        name: "Kundan",
        role: "picker",
        pin: "3003"
      },

      "packer_sarika": {
        name: "Sarika",
        role: "packer",
        pin: "4001"
      },

      "packer_komal": {
        name: "Komal",
        role: "packer",
        pin: "4002"
      }

    };



    let currentUser = null;

    let allTasks = [];

    let unsubscribeTasks = null;



    /* ================= LOGIN ================= */

    window.handleLogin = () => {

      const selectedKey =
        document.getElementById("userSelect").value;


      const enteredPin =
        document.getElementById("pinInput").value;


      const user = USERS[selectedKey];



      if (user && user.pin === enteredPin) {


        currentUser = user;


        document
          .getElementById("loginError")
          .classList
          .add("hidden");


        document
          .getElementById("loginScreen")
          .classList
          .add("hidden");


        document
          .getElementById("appScreen")
          .classList
          .remove("hidden");


        document
          .getElementById("displayUserName")
          .textContent = currentUser.name;


        document
          .getElementById("displayUserRole")
          .textContent = currentUser.role.toUpperCase();



        if (currentUser.role === "admin") {

          document
            .getElementById("addBoxBtn")
            .classList
            .remove("hidden");

        }

        else {

          document
            .getElementById("addBoxBtn")
            .classList
            .add("hidden");

        }



        listenToDatabase();


      }

      else {

        document
          .getElementById("loginError")
          .classList
          .remove("hidden");

      }

    };



    /* ================= LOGOUT ================= */

    window.handleLogout = () => {


      if (unsubscribeTasks) {

        unsubscribeTasks();

        unsubscribeTasks = null;

      }


      currentUser = null;

      allTasks = [];


      document
        .getElementById("pinInput")
        .value = "";


      document
        .getElementById("appScreen")
        .classList
        .add("hidden");


      document
        .getElementById("loginScreen")
        .classList
        .remove("hidden");

    };



    /* ================= MODALS ================= */

    window.openAddModal = () => {

      document
        .getElementById("addModal")
        .classList
        .remove("hidden");

    };



    window.closeAddModal = () => {

      document
        .getElementById("addModal")
        .classList
        .add("hidden");


      document
        .getElementById("newBatchForm")
        .reset();

    };



    window.closeEditModal = () => {

      document
        .getElementById("editModal")
        .classList
        .add("hidden");

    };



    /* ================= DATABASE LISTENER ================= */

    function listenToDatabase() {


      if (unsubscribeTasks) {

        unsubscribeTasks();

      }


      unsubscribeTasks = onSnapshot(
        ordersCol,
        (snapshot) => {


          allTasks = [];


          snapshot.forEach((docSnap) => {

            allTasks.push({

              id: docSnap.id,

              ...docSnap.data()

            });

          });



          /* Latest Created OR Updated Task First */

          allTasks.sort((a, b) => {


            const timeA =
              a.updatedAt?.seconds ||
              a.createdAt?.seconds ||
              0;


            const timeB =
              b.updatedAt?.seconds ||
              b.createdAt?.seconds ||
              0;


            return timeB - timeA;

          });



          renderTasks();

        },

        (error) => {

          console.error("Firestore Error:", error);

        }

      );

    }



    /* ================= RENDER TASKS ================= */

    function renderTasks() {


      const grid =
        document.getElementById("cardsGrid");


      grid.innerHTML = "";


      if (!currentUser) return;



      const visibleCards = allTasks.filter(item => {


        if (currentUser.role === "admin") {

          return true;

        }


        if (currentUser.role === "picker") {

          return item.picker === currentUser.name;

        }


        if (currentUser.role === "packer") {

          return item.packer === currentUser.name;

        }


        return false;

      });



      if (visibleCards.length === 0) {


        grid.innerHTML = `

          <div class="col-span-full py-12 text-center text-slate-400 font-medium">

            No tasks assigned to ${currentUser.name}

          </div>

        `;


        return;

      }



      visibleCards.forEach(item => {


        const card =
          document.createElement("div");



        card.className =
          `p-4 rounded-xl border bg-white shadow-sm flex flex-col justify-between
          ${item.hasError
            ? "border-red-400 ring-1 ring-red-300"
            : "border-slate-200"
          }`;



        const pickBadge =
          item.pickingStatus === "Complete"
            ? "bg-emerald-100 text-emerald-800"
            : item.pickingStatus === "Ongoing"
              ? "bg-amber-100 text-amber-800"
              : "bg-slate-100 text-slate-600";



        const packBadge =
          item.packingStatus === "Complete"
            ? "bg-emerald-100 text-emerald-800"
