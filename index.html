<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warehouse Master Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="flex min-h-screen items-center justify-center p-4">
    <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-xl w-full max-w-sm border border-slate-200">
      <div class="text-center mb-6">
        <div class="inline-flex p-3 bg-blue-50 text-blue-600 rounded-full mb-2">
          <i class="fa-solid fa-boxes-stacked text-2xl"></i>
        </div>
        <h1 class="text-xl font-bold text-slate-900">Warehouse Portal</h1>
        <p class="text-xs text-slate-500">Select user & enter 4-digit PIN</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Select Profile</label>
          <select id="userSelect" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <optgroup label="👑 Admins">
              <option value="admin_zoro">Zoro (Admin 1)</option>
              <option value="admin_aditya">Aditya (Admin 2)</option>
            </optgroup>
            <optgroup label="📋 Pickers">
              <option value="picker_princ">Princ (Picker 1)</option>
              <option value="picker_anas">Anas (Picker 2)</option>
              <option value="picker_kundan">Kundan (Picker 3)</option>
            </optgroup>
            <optgroup label="📦 Packers">
              <option value="packer_sarika">Sarika (Packer 1)</option>
              <option value="packer_komal">Komal (Packer 2)</option>
            </optgroup>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">4-Digit Security PIN</label>
          <input id="pinInput" type="password" maxlength="4" placeholder="••••" class="w-full text-center tracking-widest text-xl font-bold border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <p id="loginError" class="text-xs text-red-500 font-medium text-center hidden">Invalid PIN! Please check and try again.</p>

        <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-sm transition shadow">
          Login to Dashboard
        </button>
      </div>
    </div>
  </div>

  <!-- MAIN APP SCREEN -->
  <div id="appScreen" class="hidden min-h-screen pb-12">
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
      <div class="max-w-5xl mx-auto px-4 py-3">
        <div class="flex justify-between items-center mb-3">
          <div>
            <h2 id="displayUserName" class="text-base font-bold text-slate-900 leading-tight"></h2>
            <span id="displayUserRole" class="text-xs font-semibold uppercase tracking-wider px-2 py-0.5 rounded bg-blue-100 text-blue-700"></span>
          </div>
          <div class="flex gap-2 items-center">
            <button id="deleteLastBtn" onclick="deleteLastTask()" class="hidden bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 px-3 py-1.5 rounded-lg text-xs font-semibold transition">
              <i class="fa-solid fa-trash-can mr-1"></i> Delete Last
            </button>
            <button id="addBoxBtn" onclick="openAddModal()" class="hidden bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow transition">
              + New Box
            </button>
            <button onclick="handleLogout()" class="text-slate-500 hover:text-red-600 p-2 rounded-lg text-sm" title="Logout">
              <i class="fa-solid fa-arrow-right-from-bracket"></i>
            </button>
          </div>
        </div>

        <!-- SEARCH BAR (DIRECT ONKEYUP/ONINPUT) -->
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs"></i>
          <input id="searchInput" onkeyup="window.onSearchChange()" oninput="window.onSearchChange()" type="text" placeholder="Type PK (e.g. PK3), Box number, Picker or Packer name..." class="w-full pl-9 pr-8 py-2 text-xs sm:text-sm bg-slate-50 border border-slate-300 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
          <button id="clearSearchBtn" onclick="window.clearSearch()" class="hidden absolute right-3 top-2.5 text-slate-400 hover:text-slate-600 text-xs">
            <i class="fa-solid fa-circle-xmark"></i>
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-5xl mx-auto p-4">
      <div id="cardsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      </div>
    </main>
  </div>

  <!-- ADMIN ADD MODAL -->
  <div id="addModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-base font-bold text-slate-900">Add New PK / Box Entry</h3>
        <button onclick="closeAddModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <form id="newBatchForm" class="space-y-3">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">PK Batch</label>
            <input id="formPk" type="text" placeholder="e.g. PK3" required class="w-full border p-2 rounded-lg text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Box Number</label>
            <input id="formBox" type="text" placeholder="e.g. Box 5" required class="w-full border p-2 rounded-lg text-sm">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Order Type</label>
          <select id="formType" class="w-full border p-2 rounded-lg text-sm bg-white">
            <option value="Single">Single</option>
            <option value="Double">Double</option>
            <option value="Triple">Triple</option>
            <option value="4 Quantity">4 Quantity</option>
            <option value="5 Quantity">5 Quantity</option>
            <option value="Bulk (6-20)">Bulk (6-20)</option>
            <option value="Global">Global</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Assign Picker</label>
            <select id="formPicker" class="w-full border p-2 rounded-lg text-sm bg-white">
              <option value="Princ">Princ</option>
              <option value="Anas">Anas</option>
              <option value="Kundan">Kundan</option>
              <option value="Unassigned">Unassigned</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Assign Packer</label>
            <select id="formPacker" class="w-full border p-2 rounded-lg text-sm bg-white">
              <option value="Sarika">Sarika</option>
              <option value="Komal">Komal</option>
              <option value="Unassigned">Unassigned</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Special Notes / Error Flag</label>
          <input id="formNotes" type="text" placeholder="e.g. 20 pending / Order 1815 error" class="w-full border p-2 rounded-lg text-sm">
        </div>

        <div class="flex gap-2 pt-3">
          <button type="button" onclick="closeAddModal()" class="w-1/2 py-2 border rounded-lg text-sm text-slate-600 font-medium">Cancel</button>
          <button type="submit" class="w-1/2 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold hover:bg-blue-700 shadow">Save Box</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JAVASCRIPT & FIREBASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, addDoc, deleteDoc, serverTimestamp } 
      from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCOY9tUBNH3O9JM3LV9ICgoO2y9PIs9dQY",
      authDomain: "warehouse-af16e.firebaseapp.com",
      projectId: "warehouse-af16e",
      storageBucket: "warehouse-af16e.firebasestorage.app",
      messagingSenderId: "574015704554",
      appId: "1:574015704554:web:5f2945974eaa50c85df693",
      measurementId: "G-TCYEM5G9EK"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const ordersCol = collection(db, "warehouse_tasks");

    const USERS = {
      "admin_zoro": { name: "Zoro", role: "admin", pin: "1111" },
      "admin_aditya": { name: "Aditya", role: "admin", pin: "2222" },
      "picker_princ": { name: "Princ", role: "picker", pin: "3001" },
      "picker_anas": { name: "Anas", role: "picker", pin: "3002" },
      "picker_kundan": { name: "Kundan", role: "picker", pin: "3003" },
      "packer_sarika": { name: "Sarika", role: "packer", pin: "4001" },
      "packer_komal": { name: "Komal", role: "packer", pin: "4002" }
    };

    let currentUser = null;
    let allLiveTasks = [];

    window.handleLogin = () => {
      const selectedKey = document.getElementById("userSelect").value;
      const enteredPin = document.getElementById("pinInput").value;
      const user = USERS[selectedKey];

      if (user && user.pin === enteredPin) {
        currentUser = user;
        document.getElementById("loginError").classList.add("hidden");
        document.getElementById("loginScreen").classList.add("hidden");
        document.getElementById("appScreen").classList.remove("hidden");
        
        document.getElementById("displayUserName").textContent = currentUser.name;
        document.getElementById("displayUserRole").textContent = currentUser.role.toUpperCase();

        if (currentUser.role === 'admin') {
          document.getElementById("addBoxBtn").classList.remove("hidden");
          document.getElementById("deleteLastBtn").classList.remove("hidden");
        } else {
          document.getElementById("addBoxBtn").classList.add("hidden");
          document.getElementById("deleteLastBtn").classList.add("hidden");
        }

        listenToDatabase();
      } else {
        document.getElementById("loginError").classList.remove("hidden");
      }
    };

    window.handleLogout = () => {
      currentUser = null;
      document.getElementById("pinInput").value = "";
      document.getElementById("searchInput").value = "";
      document.getElementById("appScreen").classList.add("hidden");
      document.getElementById("loginScreen").classList.remove("hidden");
    };

    window.openAddModal = () => document.getElementById("addModal").classList.remove("hidden");
    window.closeAddModal = () => {
      document.getElementById("addModal").classList.add("hidden");
      document.getElementById("newBatchForm").reset();
    };

    window.onSearchChange = () => {
      const val = document.getElementById("searchInput").value;
      const clearBtn = document.getElementById("clearSearchBtn");
      if (val.trim() !== "") {
        clearBtn.classList.remove("hidden");
      } else {
        clearBtn.classList.add("hidden");
      }
      renderCards();
    };

    window.clearSearch = () => {
      const input = document.getElementById("searchInput");
      if (input) input.value = "";
      document.getElementById("clearSearchBtn").classList.add("hidden");
      renderCards();
    };

    function listenToDatabase() {
      onSnapshot(ordersCol, (snapshot) => {
        allLiveTasks = [];
        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          let ts = 0;
          if (data.createdAt && data.createdAt.seconds) {
            ts = data.createdAt.seconds;
          }
          allLiveTasks.push({ 
            id: docSnap.id, 
            ...data,
            _time: ts
          });
        });

        // Always sort newest items to TOP
        allLiveTasks.sort((a, b) => b._time - a._time);

        renderCards();
      });
    }

    function renderCards() {
      const grid = document.getElementById("cardsGrid");
      if (!grid || !currentUser) return;
      grid.innerHTML = "";
      
      const searchRaw = (document.getElementById("searchInput")?.value || "").toLowerCase().trim();

      // 1. Role filter
      let userList = allLiveTasks.filter(item => {
        if (currentUser.role === 'admin') return true;
        if (currentUser.role === 'picker') return (item.picker || '').toLowerCase() === currentUser.name.toLowerCase();
        if (currentUser.role === 'packer') return (item.packer || '').toLowerCase() === currentUser.name.toLowerCase();
        return false;
      });

      // 2. Search query filter
      let displayList = userList.filter(item => {
        if (!searchRaw) return true;
        
        const fullString = [
          item.pkBatch,
          item.boxNo,
          item.picker,
          item.packer,
          item.orderType,
          item.notes,
          item.pickingStatus,
          item.packingStatus
        ].join(" ").toLowerCase();

        return fullString.includes(searchRaw);
      });

      if (displayList.length === 0) {
        grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400 font-medium">No tasks found</div>`;
        return;
      }

      displayList.forEach(item => {
        const card = document.createElement("div");
        card.className = `p-4 rounded-xl border bg-white shadow-sm flex flex-col justify-between ${item.hasError ? 'border-red-400 ring-1 ring-red-300' : 'border-slate-200'}`;

        const pickBadge = item.pickingStatus === 'Complete' ? 'bg-emerald-100 text-emerald-800' : item.pickingStatus === 'Ongoing' ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-600';
        const packBadge = item.packingStatus === 'Complete' ? 'bg-emerald-100 text-emerald-800' : item.packingStatus === 'Ongoing' ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-600';

        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start mb-2">
              <div>
                <span class="inline-block bg-blue-50 text-blue-700 text-xs font-bold px-2 py-0.5 rounded border border-blue-100 mb-1">${item.pkBatch}</span>
                <h4 class="text-base font-extrabold text-slate-900">${item.boxNo}</h4>
              </div>
              <div class="flex items-center gap-2">
                <span class="text-xs font-semibold px-2 py-0.5 rounded bg-slate-100 text-slate-700">
                  ${item.orderType || 'General'}
                </span>
                ${currentUser.role === 'admin' ? `
                  <button onclick="deleteDocItem('${item.id}', '${item.pkBatch} - ${item.boxNo}')" class="text-red-400 hover:text-red-600 p-1" title="Delete box">
                    <i class="fa-solid fa-trash-can text-sm"></i>
                  </button>
                ` : ''}
              </div>
            </div>

            <div class="text-xs space-y-1 my-3 bg-slate-50 p-2.5 rounded-lg border border-slate-100">
              <div class="flex justify-between">
                <span class="text-slate-500 font-medium">Picker: <strong>${item.picker}</strong></span>
                <span class="px-1.5 py-0.5 rounded text-[10px] font-bold ${pickBadge}">${item.pickingStatus}</span>
              </div>
              <div class="flex justify-between">
                <span class="text-slate-500 font-medium">Packer: <strong>${item.packer}</strong></span>
                <span class="px-1.5 py-0.5 rounded text-[10px] font-bold ${packBadge}">${item.packingStatus}</span>
              </div>
              ${item.pendingQty ? `<div class="text-red-600 font-bold pt-1">Pending Qty: ${item.pendingQty}</div>` : ''}
            </div>

            ${item.notes ? `<p class="text-xs bg-amber-50 text-amber-900 border border-amber-200 p-2 rounded-lg mb-3">⚠️ ${item.notes}</p>` : ''}
          </div>

          <div class="pt-3 border-t border-slate-100 space-y-2">
            ${(currentUser.role === 'picker' || currentUser.role === 'admin') ? `
              <div class="flex gap-1.5 items-center">
                <span class="text-[11px] font-bold text-slate-400 w-12">Pick:</span>
                <button onclick="updatePickStatus('${item.id}', 'Assigned')" class="flex-1 py-1 text-xs font-medium rounded ${item.pickingStatus === 'Assigned' ? 'bg-slate-800 text-white' : 'bg-slate-100'}">Assigned</button>
                <button onclick="updatePickStatus('${item.id}', 'Ongoing')" class="flex-1 py-1 text-xs font-medium rounded ${item.pickingStatus === 'Ongoing' ? 'bg-amber-500 text-white' : 'bg-slate-100'}">Ongoing</button>
                <button onclick="updatePickStatus('${item.id}', 'Complete')" class="flex-1 py-1 text-xs font-medium rounded ${item.pickingStatus === 'Complete' ? 'bg-emerald-600 text-white' : 'bg-slate-100'}">Done</button>
              </div>
            ` : ''}

            ${(currentUser.role === 'packer' || currentUser.role === 'admin') ? `
              <div class="flex gap-1.5 items-center">
                <span class="text-[11px] font-bold text-slate-400 w-12">Pack:</span>
                <button onclick="updatePackStatus('${item.id}', 'Assigned')" class="flex-1 py-1 text-xs font-medium rounded ${item.packingStatus === 'Assigned' ? 'bg-slate-800 text-white' : 'bg-slate-100'}">Assigned</button>
                <button onclick="updatePackStatus('${item.id}', 'Ongoing')" class="flex-1 py-1 text-xs font-medium rounded ${item.packingStatus === 'Ongoing' ? 'bg-amber-500 text-white' : 'bg-slate-100'}">Ongoing</button>
                <button onclick="updatePackStatus('${item.id}', 'Complete')" class="flex-1 py-1 text-xs font-medium rounded ${item.packingStatus === 'Complete' ? 'bg-emerald-600 text-white' : 'bg-slate-100'}">Done</button>
              </div>
              
              <div class="flex items-center gap-2 pt-1">
                <input type="number" id="qty_${item.id}" placeholder="Pending Qty" value="${item.pendingQty || ''}" class="w-1/2 border p-1 text-xs rounded text-center">
                <button onclick="saveQty('${item.id}')" class="w-1/2 bg-slate-200 hover:bg-slate-300 py-1 text-xs font-semibold rounded">Save Qty</button>
              </div>
            ` : ''}

            ${currentUser.role === 'admin' ? `
              <div class="flex justify-between items-center pt-2 text-xs border-t border-dashed">
                <button onclick="toggleErrorFlag('${item.id}', ${item.hasError || false})" class="text-red-600 font-semibold hover:underline">
                  ${item.hasError ? 'Clear Error' : 'Flag Error'}
                </button>
                <button onclick="deleteDocItem('${item.id}', '${item.pkBatch} - ${item.boxNo}')" class="text-red-600 hover:underline font-medium">Delete Box</button>
              </div>
            ` : ''}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    document.getElementById("newBatchForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      await addDoc(ordersCol, {
        pkBatch: document.getElementById("formPk").value.trim(),
        boxNo: document.getElementById("formBox").value.trim(),
        order            <label class="block text-xs font-semibold text-slate-600 mb-1">PK Batch</label>
            <input id="formPk" type="text" placeholder="e.g. PK3" required class="w-full border p-2 rounded-lg text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Box Number</label>
            <input id="formBox" type="text" placeholder="e.g. Box 5" required class="w-full border p-2 rounded-lg text-sm">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Order Type</label>
          <select id="formType" class="w-full border p-2 rounded-lg text-sm bg-white">
            <option value="Single">Single</option>
            <option value="Double">Double</option>
            <option value="Triple">Triple</option>
            <option value="4 Quantity">4 Quantity</option>
            <option value="5 Quantity">5 Quantity</option>
            <option value="Bulk (6-20)">Bulk (6-20)</option>
            <option value="Global">Global</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Assign Picker</label>
            <select id="formPicker" class="w-full border p-2 rounded-lg text-sm bg-white">
              <option value="Princ">Princ</option>
              <option value="Anas">Anas</option>
              <option value="Kundan">Kundan</option>
              <option value="Unassigned">Unassigned</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Assign Packer</label>
            <select id="formPacker" class="w-full border p-2 rounded-lg text-sm bg-white">
              <option value="Sarika">Sarika</option>
              <option value="Komal">Komal</option>
              <option value="Unassigned">Unassigned</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Special Notes / Error Flag</label>
          <input id="formNotes" type="text" placeholder="e.g. 20 pending / Order 1815 error" class="w-full border p-2 rounded-lg text-sm">
        </div>

        <div class="flex gap-2 pt-3">
          <button type="button" onclick="closeAddModal()" class="w-1/2 py-2 border rounded-lg text-sm text-slate-600 font-medium">Cancel</button>
          <button type="submit" class="w-1/2 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold hover:bg-blue-700 shadow">Save Box</button>
        </div>
      </form>
    </div>
  </div>

  <!-- FIREBASE SCRIPTS -->
  <script type="module">

    import { getFirestore, collection, onSnapshot, doc, updateDoc, addDoc, deleteDoc, serverTimestamp }

    let currentUser = null;

    window.handleLogin = () => {

      if (user && user.pin === enteredPin) {
        currentUser = user;
        document.getElementById("loginError").classList.add("hidden");
        document.getElementById("loginScreen").classList.add("hidden");
        document.getElementById("appScreen").classList.remove("hidden");
